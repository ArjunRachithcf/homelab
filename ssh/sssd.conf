# /etc/sssd/sssd.conf (template; ssh/setup-host.sh fills __SSH_LDAP_BIND_PASSWORD__, 0600)
# Used only by sshd: pam_sss in /etc/pam.d/sshd and sss_ssh_authorizedkeys. nsswitch and
# authselect are unchanged, so console login, sudo and user IDs stay local.
[sssd]
services = nss, pam, ssh
domains = authentik

[domain/authentik]
id_provider = ldap
auth_provider = ldap
# sshd's PAM account phase stays local (password-auth); the Authentik application only
# lets ssh-admins bind anyway.
access_provider = permit
ldap_uri = ldaps://ldap.homelab.internal:6636
ldap_tls_reqcert = demand
ldap_tls_cacert = /etc/sssd/pki/ldap-ssh.pem
ldap_search_base = dc=ssh,dc=goauthentik,dc=io
ldap_user_search_base = ou=users,dc=ssh,dc=goauthentik,dc=io
ldap_group_search_base = ou=groups,dc=ssh,dc=goauthentik,dc=io
ldap_default_bind_dn = cn=ldap-ssh,ou=users,dc=ssh,dc=goauthentik,dc=io
ldap_default_authtok = __SSH_LDAP_BIND_PASSWORD__
ldap_schema = rfc2307bis
ldap_user_object_class = user
ldap_user_name = cn
ldap_group_object_class = group
ldap_group_name = cn
ldap_group_member = member
ldap_user_ssh_public_key = sshPublicKey
# The Authentik user may be "JaneSmith" (ADMIN_LOGIN) and the Linux user "janesmith" (ADMIN_USER)
case_sensitive = false
# No offline logins: every SSH login asks Authentik (a TOTP code can't be replayed anyway)
cache_credentials = false
# Keys (and the rest of a user's entry) are asked for again after a minute, not 90 (the default): a key removed on
# the home page stops working, and a new one starts, within a minute. Only sshd uses this domain.
entry_cache_timeout = 60
enumerate = false
