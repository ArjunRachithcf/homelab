# /etc/ssh/sshd_config.d/10-homelab.conf
# Sorts before Fedora's 50-redhat.conf, so these values win (sshd uses the first value it sees).
# Installed by ssh/setup-host.sh, which replaces __NETBIRD_IP__ and __SSH_USER__
# (RUNBOOK.md step 10).

# Listen only on the NetBird interface: not on the LAN, never on the internet.
# Works at boot before wt0 is up thanks to net.ipv4.ip_nonlocal_bind=1 (step 1).
ListenAddress __NETBIRD_IP__

# One named user, no root.
PermitRootLogin no
AllowUsers __SSH_USER__

# Both factors come from Authentik (LDAP outpost `ldap-ssh`, via SSSD):
#  1. a key listed in your Authentik profile (attribute sshPublicKey, one line per device),
#  2. then keyboard-interactive: PAM (pam_sss) asks "Password:", answer "password;123456"
#     (Authentik password, semicolon, current TOTP code).
# ~/.ssh/authorized_keys is ignored, so a key can only be added or revoked in Authentik.
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys %u
AuthorizedKeysCommandUser nobody
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication yes
AuthenticationMethods publickey,keyboard-interactive

# Which key each login used ("Partial publickey … SHA256:…"): at INFO sshd logs only the final keyboard-interactive
# step. The home page's SSH keys sheet shows each key's last use from it (lib/ssh_keys.py).
LogLevel VERBOSE

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
