[package]
name = "homelab-setup"
version = "0.1.0"
description = "Guided setup for the homelab: this computer or another one over SSH"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
sha2 = "0.11"
base64 = "0.23"
dirs = "7"
# The assistant (Phase 3c): Anthropic's Messages API or a local Ollama, and the API key in the OS keychain
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# The sudo password and the answers in memory: wiped when dropped
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
