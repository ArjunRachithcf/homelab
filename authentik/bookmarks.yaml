# ~/homelab/authentik/bookmarks.yaml
# Bookmarks (Karakeep, links.<domain>, RUNBOOK.md 7d): OIDC, the app itself only allows this
# login; family, not kids. Needs KARAKEEP_OIDC_CLIENT_SECRET in the worker's environment (setup-ssh.sh passes it
# from .env).
#
# Applied by `authentik/setup-ssh.sh component bookmarks` when bookmarks is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - Bookmarks
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Karakeep (links.<domain>) ─────────────────────────────────────────
  # Callback from NEXTAUTH_URL (docker-compose.yml). The first user to sign in is Karakeep's admin.
  - model: authentik_providers_oauth2.oauth2provider
    id: karakeep-provider
    identifiers:
      name: Provider for Bookmarks
    attrs:
      client_type: confidential
      client_id: karakeep
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env KARAKEEP_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://links.__DOMAIN__:__PUBLIC_PORT__/api/auth/callback/custom
  # family, and not kids (kids are in family too): both must pass (mode all)
  - model: authentik_core.application
    id: karakeep-app
    identifiers:
      slug: karakeep
    attrs:
      name: Bookmarks
      provider: !KeyOf karakeep-provider
      meta_launch_url: https://links.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf karakeep-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf karakeep-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
