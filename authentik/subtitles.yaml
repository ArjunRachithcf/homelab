# ~/homelab/authentik/subtitles.yaml
# Subtitles (subs.<domain>): Bazarr, for admins, NetBird only. No OIDC, so Caddy asks Authentik first (forward-auth,
# every path) and then fills in Bazarr's own Basic login (BAZARR_AUTH). Applied by `authentik/setup-ssh.sh component
# subtitles` (also part of `hardening`), which also adds the provider to the embedded outpost. Needs family.yaml.
version: 1
metadata:
  name: homelab - subtitles
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # External host carries the public port: Caddy serves this site only there (Caddyfile `canonical`).
  - model: authentik_providers_proxy.proxyprovider
    id: bazarr-provider
    identifiers:
      name: Provider for Bazarr
    attrs:
      mode: forward_single
      external_host: https://subs.__DOMAIN__:__PUBLIC_PORT__
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same as the UI sets: username/groups for the X-Authentik-* headers
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  - model: authentik_core.application
    id: bazarr-app
    identifiers:
      slug: bazarr
    attrs:
      name: Bazarr
      provider: !KeyOf bazarr-provider
      meta_launch_url: https://subs.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bazarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
