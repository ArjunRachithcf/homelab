# ~/homelab/authentik/notes.yaml
# Notes (notes.<domain>, component notes, RUNBOOK.md step 7f). Applied by
# `authentik/setup-ssh.sh family-apps` when notes is chosen (also part of `hardening`). Only its own
# Authentik login, no forward-auth: a confidential client (client_id memos, secret
# MEMOS_OIDC_CLIENT_SECRET from .env), family only, kids refused (binding mode all, kids negated, like Share).
#
# Needs the secret in the worker's environment (setup-ssh.sh passes it from .env) and the
# mapping "email (verified)" from family.yaml.
version: 1
metadata:
  name: homelab - Notes
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Notes (notes.<domain>) ── Memos: SSO users are plain users; its admin is a local account (family-wizard.sh)
  - model: authentik_providers_oauth2.oauth2provider
    id: memos-provider
    identifiers:
      name: Provider for Notes
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      client_id: memos
      client_secret: !Env MEMOS_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://notes.__DOMAIN__:__PUBLIC_PORT__/auth/callback
  - model: authentik_core.application
    id: memos-app
    identifiers:
      slug: memos
    attrs:
      name: Notes
      provider: !KeyOf memos-provider
      meta_launch_url: https://notes.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf memos-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf memos-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
