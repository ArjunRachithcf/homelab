# ~/homelab/authentik/jellyfin.yaml
# Jellyfin's web sign-in, one click from home (Jellyfin SSO plugin, OIDC, RUNBOOK.md 7b); apps keep
# the LDAP login (jellyfin-ldap.yaml). Needs JELLYFIN_OIDC_CLIENT_SECRET in the worker's environment
# (setup-ssh.sh passes it from .env).
#
# Applied by `authentik/setup-ssh.sh component jellyfin` when jellyfin is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - Jellyfin
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Jellyfin web: one click from home (Jellyfin SSO plugin, OIDC) ──────
  # Apps (Swiftfin, TV) keep the LDAP login (jellyfin-ldap.yaml); the plugin's DefaultProvider
  # keeps SSO-created users on LDAP so "password;TOTP" works for them too.
  - model: authentik_providers_oauth2.oauth2provider
    id: jellyfin-provider
    identifiers:
      name: Provider for Jellyfin (SSO)
    attrs:
      client_type: confidential
      client_id: jellyfin
      # Must be listed (a blueprint leaves it empty → "invalid_request ... otherwise malformed")
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env JELLYFIN_OIDC_CLIENT_SECRET
      # No consent screen: the family already signed in to get here
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      # profile carries "groups" (the plugin's RoleClaim)
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: regex
          url: '^https://jellyfin\.__DOMAINS_RE__(:__PUBLIC_PORT__)?/sso/OID/(redirect|r)/authentik$'
  - model: authentik_core.application
    id: jellyfin-app
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      provider: !KeyOf jellyfin-provider
      meta_launch_url: https://jellyfin.__DOMAIN__:__PUBLIC_PORT__/sso/OID/start/authentik
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf jellyfin-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
