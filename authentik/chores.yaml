# ~/homelab/authentik/chores.yaml
# Chores (chores.<domain>, component chores, RUNBOOK.md step 7f). Applied by
# `authentik/setup-ssh.sh family-apps` when chores is chosen (also part of `hardening`). Only its own
# Authentik login, no forward-auth: a confidential client (client_id donetick, secret
# DONETICK_OIDC_CLIENT_SECRET from .env), family and kids.
#
# Needs the secret in the worker's environment (setup-ssh.sh passes it from .env) and the
# mapping "email (verified)" from family.yaml.
version: 1
metadata:
  name: homelab - Chores
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Chores (chores.<domain>) ── Donetick: web and phone app callbacks; circle role from groups (authentik Admins = admin)
  - model: authentik_providers_oauth2.oauth2provider
    id: donetick-provider
    identifiers:
      name: Provider for Chores
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      client_id: donetick
      client_secret: !Env DONETICK_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://chores.__DOMAIN__:__PUBLIC_PORT__/auth/oauth2
        - matching_mode: strict
          url: donetick://auth/oauth2
  - model: authentik_core.application
    id: donetick-app
    identifiers:
      slug: donetick
    attrs:
      name: Chores
      provider: !KeyOf donetick-provider
      meta_launch_url: https://chores.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf donetick-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
