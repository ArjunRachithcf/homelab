# ~/homelab/authentik/pdf.yaml
# PDF tools (BentoPDF, pdf.<domain>, RUNBOOK.md 7d): forward-auth through Caddy and the embedded
# outpost; family, not kids. setup-ssh.sh then adds the provider to the embedded outpost (a list addition a
# blueprint would replace).
#
# Applied by `authentik/setup-ssh.sh component pdf` when pdf is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - PDF tools
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # Forward-auth (single application per host), like Home. External hosts carry the public port:
  # Caddy serves these sites only there (Caddyfile `canonical`).
  - model: authentik_providers_proxy.proxyprovider
    id: pdf-provider
    identifiers:
      name: Provider for PDF tools
    attrs:
      mode: forward_single
      external_host: https://pdf.__DOMAIN__:__PUBLIC_PORT__
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same as the UI sets: username/groups for the X-Authentik-* headers
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  # family, and not kids (kids are in family too): both must pass (mode all)
  - model: authentik_core.application
    id: pdf-app
    identifiers:
      slug: pdf
    attrs:
      name: PDF tools
      provider: !KeyOf pdf-provider
      meta_launch_url: https://pdf.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pdf-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pdf-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
