# ~/homelab/authentik/photos.yaml
# Photos (Immich, photos.<domain>, RUNBOOK.md 7c): OIDC for web and the Immich app, family (not kids);
# authentik Admins are Immich admins. Needs IMMICH_OIDC_CLIENT_SECRET in the worker's environment
# (setup-ssh.sh passes it from .env).
#
# Applied by `authentik/setup-ssh.sh component photos` when photos is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - Photos
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Photos (Immich, photos.<domain>): OIDC for web and the Immich app ──
  # Immich creates the user at first sign-in; immich_role makes authentik Admins Immich admins.
  - model: authentik_providers_oauth2.scopemapping
    id: immich-scope
    identifiers:
      name: Photos role (immich_role)
    attrs:
      scope_name: immich
      description: Your role in Photos
      expression: |
        return {"immich_role": "admin" if ak_is_group_member(request.user, name="authentik Admins") else "user"}
  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: Provider for Photos
    attrs:
      client_type: confidential
      client_id: immich
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf immich-scope
      redirect_uris:
        - matching_mode: regex
          url: '^https://photos\.__DOMAINS_RE__(:__PUBLIC_PORT__)?/(auth/login|user-settings|api/oauth/mobile-redirect)$'
        # iOS/Android app
        - matching_mode: strict
          url: app.immich:///oauth-callback
  # family, and not kids (kids are in family too): both must pass (mode all)
  - model: authentik_core.application
    id: immich-app
    identifiers:
      slug: immich
    attrs:
      name: Photos
      provider: !KeyOf immich-provider
      meta_launch_url: https://photos.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
