# ~/homelab/authentik/share.yaml
# Share (Sharry, share.<domain>, RUNBOOK.md 7e): confidential OIDC client (family, not kids).
# Needs SHARRY_OIDC_CLIENT_SECRET in the worker's environment (setup-ssh.sh passes it from .env).
#
# Applied by `authentik/setup-ssh.sh component share` when share is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - Share
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Share (Sharry, share.<domain>) ────────────────────────────────────
  # Sharry sends the secret in the token request's body (client_secret_post) and names the
  # account <preferred_username>@authentik.
  - model: authentik_providers_oauth2.oauth2provider
    id: sharry-provider
    identifiers:
      name: Provider for Share
    attrs:
      client_type: confidential
      client_id: sharry
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env SHARRY_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://share.__DOMAIN__:__PUBLIC_PORT__/api/v2/open/auth/oauth/authentik/resume
  # family, and not kids: both must pass (mode all)
  - model: authentik_core.application
    id: sharry-app
    identifiers:
      slug: sharry
    attrs:
      name: Share
      provider: !KeyOf sharry-provider
      meta_launch_url: https://share.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sharry-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sharry-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
