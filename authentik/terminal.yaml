# ~/homelab/authentik/terminal.yaml
# Terminal (Termix, term.<domain>): a web SSH client for admins, NetBird only. Applied by
# `authentik/setup-ssh.sh terminal` (also part of `hardening`). Needs TERMIX_OIDC_CLIENT_SECRET in the
# worker's environment (setup-ssh.sh passes it from .env) and "groups (homelab)" from family.yaml.
#
# Only `authentik Admins` may sign in; Termix makes members of that group (groups claim) its admins.
# Signing in to Termix is not signing in to the PC: sshd still wants the key Termix holds (registered
# with setup-ssh.sh add-key) plus password;TOTP for every session.
version: 1
metadata:
  name: homelab - Terminal
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: termix-provider
    identifiers:
      name: Provider for Terminal
    attrs:
      client_type: confidential
      client_id: termix
      client_secret: !Env TERMIX_OIDC_CLIENT_SECRET
      grant_types: [authorization_code]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_token_validity: minutes=10
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, groups (homelab)]]
      redirect_uris:
        # NetBird peers use either port
        - matching_mode: strict
          url: https://term.__DOMAIN__:__PUBLIC_PORT__/users/oidc/callback
        - matching_mode: strict
          url: https://term.__DOMAIN__/users/oidc/callback
  - model: authentik_core.application
    id: termix-app
    identifiers:
      slug: termix
    attrs:
      name: Terminal
      provider: !KeyOf termix-provider
      meta_launch_url: https://term.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf termix-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
