# ~/homelab/authentik/downloads.yaml
# Downloads (qbit.<domain>, prowlarr.<domain>): qBittorrent and Prowlarr, behind the VPN, for admins, NetBird only.
# Neither has OIDC, so Caddy asks Authentik first (forward-auth, every path) and each keeps its own login behind it.
# Applied by `authentik/setup-ssh.sh component downloads` (also part of `hardening`), which also adds the providers
# to the embedded outpost. Needs family.yaml.
version: 1
metadata:
  name: homelab - downloads
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # External host carries the public port: Caddy serves this site only there (Caddyfile `canonical`).
  - model: authentik_providers_proxy.proxyprovider
    id: qbittorrent-provider
    identifiers:
      name: Provider for qBittorrent
    attrs:
      mode: forward_single
      external_host: https://qbit.__DOMAIN__:__PUBLIC_PORT__
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same as the UI sets: username/groups for the X-Authentik-* headers
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  - model: authentik_core.application
    id: qbittorrent-app
    identifiers:
      slug: qbittorrent
    attrs:
      name: qBittorrent
      provider: !KeyOf qbittorrent-provider
      meta_launch_url: https://qbit.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf qbittorrent-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  # External host carries the public port: Caddy serves this site only there (Caddyfile `canonical`).
  - model: authentik_providers_proxy.proxyprovider
    id: prowlarr-provider
    identifiers:
      name: Provider for Prowlarr
    attrs:
      mode: forward_single
      external_host: https://prowlarr.__DOMAIN__:__PUBLIC_PORT__
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same as the UI sets: username/groups for the X-Authentik-* headers
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  - model: authentik_core.application
    id: prowlarr-app
    identifiers:
      slug: prowlarr
    attrs:
      name: Prowlarr
      provider: !KeyOf prowlarr-provider
      meta_launch_url: https://prowlarr.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prowlarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
