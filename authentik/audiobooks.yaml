# ~/homelab/authentik/audiobooks.yaml
# Audiobooks (Audiobookshelf, books.<domain>, RUNBOOK.md 7d): OIDC, the app itself only allows
# this login; family. Needs ABS_OIDC_CLIENT_SECRET in the worker's environment (setup-ssh.sh passes it
# from .env).
#
# Applied by `authentik/setup-ssh.sh component audiobooks` when audiobooks is chosen (also part of
# `hardening`, so it's re-applied after upgrades).
version: 1
metadata:
  name: homelab - Audiobooks
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Audiobookshelf (books.<domain>): web and the app ──────────────────
  # ABS asks for a scope named like its "Group Claim" setting (absgroups) and reads the claim from
  # userinfo: admin for authentik Admins, user for everyone else.
  - model: authentik_providers_oauth2.scopemapping
    id: abs-scope
    identifiers:
      name: Audiobooks role (absgroups)
    attrs:
      scope_name: absgroups
      description: Your role in Audiobooks
      expression: |
        return {"absgroups": ["admin"] if ak_is_group_member(request.user, name="authentik Admins") else ["user"]}
  - model: authentik_providers_oauth2.oauth2provider
    id: abs-provider
    identifiers:
      name: Provider for Audiobooks
    attrs:
      client_type: confidential
      client_id: audiobookshelf
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env ABS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf abs-scope
      # The app goes through mobile-redirect, then ABS sends it on to audiobookshelf://oauth
      # (ABS setting "Allowed Mobile Redirect URIs": audiobookshelf://oauth, shelfplayer://callback)
      redirect_uris:
        - matching_mode: regex
          url: '^https://books\.__DOMAIN_RE__:__PUBLIC_PORT__/auth/openid/(callback|mobile-redirect)$'
  - model: authentik_core.application
    id: abs-app
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobooks
      provider: !KeyOf abs-provider
      meta_launch_url: https://books.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf abs-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
