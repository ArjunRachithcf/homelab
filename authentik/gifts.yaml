# ~/homelab/authentik/gifts.yaml
# Gifts (gifts.<domain>, component gifts, RUNBOOK.md step 7f). Applied by
# `authentik/setup-ssh.sh family-apps` when gifts is chosen (also part of `hardening`). Only its own
# Authentik login, no forward-auth: a confidential client (client_id wishlist, secret
# WISHLIST_OIDC_CLIENT_SECRET from .env), family and kids.
#
# Needs the secret in the worker's environment (setup-ssh.sh passes it from .env) and the
# mapping "email (verified)" from family.yaml. Wishlist knows no admin group: everyone signs in as a member,
# and `wishlist/setup.sh admin LOGIN` (family-wizard.sh, after the first sign-in) makes an admin.
version: 1
metadata:
  name: homelab - Gifts
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Gifts (gifts.<domain>) ── Wishlist: its callback is /login
  - model: authentik_providers_oauth2.oauth2provider
    id: wishlist-provider
    identifiers:
      name: Provider for Gifts
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      client_id: wishlist
      client_secret: !Env WISHLIST_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://gifts.__DOMAIN__:__PUBLIC_PORT__/login
  - model: authentik_core.application
    id: wishlist-app
    identifiers:
      slug: wishlist
    attrs:
      name: Gifts
      provider: !KeyOf wishlist-provider
      meta_launch_url: https://gifts.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wishlist-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
