# ~/homelab/authentik/ssh-ldap.yaml
# SSH into the PC checks keys and "password;TOTP" against Authentik over LDAP (SSSD on the host).
# Applied by authentik/setup-ssh.sh (which first creates the certificate `ldap-ssh`), idempotent.
# RUNBOOK.md step 10.
#
# - Only members of `ssh-admins` (and the bind account) may bind.
# - Own bind flow: password, then TOTP/static code as "password;123456" (Code-based MFA).
#   The bind account `ldap-ssh` is the only one that skips the code.
# - Keys: the user attribute `sshPublicKey` (a list, one line per device), exposed as the
#   LDAP attribute of the same name and read by sss_ssh_authorizedkeys.
# - Own outpost `ldap-ssh` (authentik-ldap-ssh in docker-compose.yml, fixed IP 172.21.1.10,
#   LDAPS on 6636, never published). Separate from Jellyfin's `ldap` outpost, so re-applying
#   either blueprint can't drop the other's provider.
version: 1
metadata:
  name: homelab - SSH LDAP
  labels:
    # Never auto-applied: it needs SSH_LDAP_BIND_PASSWORD from .env
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_core.group
    id: ssh-admins
    identifiers:
      name: ssh-admins
    state: created

  - model: authentik_core.user
    id: bind-user
    identifiers:
      username: ldap-ssh
    attrs:
      name: SSH (SSSD) LDAP bind
      type: service_account
      path: goauthentik.io/service-accounts

  - model: authentik_core.token
    identifiers:
      identifier: ldap-ssh-app-password
    attrs:
      user: !KeyOf bind-user
      intent: app_password
      expiring: false
      key: !Env SSH_LDAP_BIND_PASSWORD
      description: SSSD LDAP bind password

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: ldap-ssh-mfa
    identifiers:
      name: ldap-ssh-mfa
    attrs:
      device_classes: [totp, static]
      not_configured_action: deny

  - model: authentik_policies_expression.expressionpolicy
    id: not-bind-user
    identifiers:
      name: ldap-ssh-mfa-unless-bind-account
    attrs:
      expression: |
        pending = request.context.get("pending_user")
        return not (pending and pending.username == "ldap-ssh")

  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: ldap-ssh-authentication-flow
    attrs:
      name: LDAP bind (SSH)
      title: LDAP bind
      designation: authentication

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf ldap-ssh-mfa
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf not-bind-user
      target: !KeyOf mfa-binding
      order: 0

  - model: authentik_providers_ldap.ldapprovider
    id: provider
    identifiers:
      name: ssh-ldap
    attrs:
      authorization_flow: !KeyOf flow
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      base_dn: DC=ssh,DC=goauthentik,DC=io
      bind_mode: direct
      search_mode: cached
      mfa_support: true
      certificate: !Find [authentik_crypto.certificatekeypair, [name, ldap-ssh]]
      tls_server_name: ldap.homelab.internal
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf bind-user

  - model: authentik_core.application
    id: app
    identifiers:
      slug: ssh-ldap
    attrs:
      name: SSH (LDAP)
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: blank://blank

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf ssh-admins
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      user: !KeyOf bind-user
      order: 1

  - model: authentik_outposts.outpost
    identifiers:
      name: ldap-ssh
    attrs:
      type: ldap
      providers:
        - !KeyOf provider
      config:
        authentik_host: http://authentik-server:9000
