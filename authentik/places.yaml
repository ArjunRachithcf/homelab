# ~/homelab/authentik/places.yaml
# Places (places.<domain>, component places, RUNBOOK.md step 7f). Applied by
# `authentik/setup-ssh.sh family-apps` when places is chosen (also part of `hardening`). Only its own
# Authentik login, no forward-auth: a confidential client (client_id dawarich, secret
# DAWARICH_OIDC_CLIENT_SECRET from .env), family only, kids refused (binding mode all, kids negated, like Share).
#
# Needs the secret in the worker's environment (setup-ssh.sh passes it from .env) and the
# mapping "email (verified)" from family.yaml.
version: 1
metadata:
  name: homelab - Places
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # ── Places (places.<domain>) ── Dawarich: OIDC only; no group mapping, its admin is set by family-wizard.sh
  - model: authentik_providers_oauth2.oauth2provider
    id: dawarich-provider
    identifiers:
      name: Provider for Places
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      client_id: dawarich
      client_secret: !Env DAWARICH_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://places.__DOMAIN__:__PUBLIC_PORT__/users/auth/openid_connect/callback
  - model: authentik_core.application
    id: dawarich-app
    identifiers:
      slug: dawarich
    attrs:
      name: Places
      provider: !KeyOf dawarich-provider
      meta_launch_url: https://places.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dawarich-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dawarich-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
