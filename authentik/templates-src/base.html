{% comment %}
Shared layout for the __BRAND__ mails (authentik/family.yaml points the email stages and the
notification transport here). Inline styles only: mail clients drop <style> blocks.
The logo is cid:logo, attached by Authentik from logo.png (mounted on the worker, docker-compose.yml).
{% endcomment %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width">
    <title>{% block title %}__BRAND__{% endblock %}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.5; color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background:#ffffff; border:1px solid #e4e4e7; border-radius:12px;">
            <tr>
              <td align="center" style="padding:28px 24px 8px;">
                <img src="cid:logo" alt="__BRAND__" width="49" height="56" style="height:56px; width:auto; border:0;">
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 28px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="max-width:480px; margin:16px auto 0; font-size:12px; color:#71717a;">
            {% block footer %}Sent by the __BRAND__ family server.{% endblock %}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
