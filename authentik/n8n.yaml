# ~/homelab/authentik/n8n.yaml
# n8n (n8n.<domain>, RUNBOOK.md 7h): workflow automation for admins, NetBird only. n8n's community
# edition has no OIDC, so Caddy asks Authentik first (forward-auth) and n8n keeps its own owner login
# behind it. Applied by `authentik/setup-ssh.sh n8n` (also part of `hardening`), which also adds the
# provider to the embedded outpost. Needs family.yaml.
version: 1
metadata:
  name: homelab - n8n
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # External host carries the public port: Caddy serves this site only there (Caddyfile `canonical`).
  - model: authentik_providers_proxy.proxyprovider
    id: n8n-provider
    identifiers:
      name: Provider for n8n
    attrs:
      mode: forward_single
      external_host: https://n8n.__DOMAIN__:__PUBLIC_PORT__
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same as the UI sets: username/groups for the X-Authentik-* headers
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  - model: authentik_core.application
    id: n8n-app
    identifiers:
      slug: n8n
    attrs:
      name: n8n
      provider: !KeyOf n8n-provider
      meta_launch_url: https://n8n.__DOMAIN__:__PUBLIC_PORT__/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf n8n-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
