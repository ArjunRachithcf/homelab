# ~/homelab/ansible.cfg: run from ~/homelab, e.g. ansible-playbook -K ansible/site.yml --check --diff
[defaults]
inventory = ansible/inventory.ini
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
nocows = true
# vars.yml reads .env through it (also for tests/render.yml, which lives outside ansible/)
lookup_plugins = ansible/lookup_plugins

[privilege_escalation]
become = true
