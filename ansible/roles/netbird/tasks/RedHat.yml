# Fedora: NetBird's rpm repo and package
- name: NetBird repo
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/netbird.repo
    content: |
      [NetBird]
      name=NetBird
      baseurl=https://pkgs.netbird.io/yum/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.netbird.io/yum/repodata/repomd.xml.key
      repo_gpgcheck=1
    mode: "0644"

- name: NetBird package
  ansible.builtin.dnf5:
    name: netbird
    state: present
