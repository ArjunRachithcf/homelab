- name: Restart sssd
  ansible.builtin.systemd_service:
    name: sssd
    state: restarted

# The drop-in alone passed `sshd -t -f`; this checks it together with Fedora's config
- name: Check sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: true
  notify: Restart sshd

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted
