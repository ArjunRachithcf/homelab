# The homelab's systemd units: backups hourly and after every change, nightly photo care,
# weekly CLI update and drift check, a mail on any failure. RUNBOOK.md steps 7c, 9.
# Only enables timers; never starts a job.
- name: Unit files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: "{{ timers_units }}"
  notify: Reload systemd

- name: backup-watch.sh may start the three backup units (polkit), nothing else
  ansible.builtin.template:
    src: 50-homelab-backups.rules.j2
    dest: /etc/polkit-1/rules.d/50-homelab-backups.rules
    owner: root
    group: polkitd
    mode: "0640"

- name: The home page's job inbox and reports (homelab-ops.path watches ops/requests; the ops container writes there)
  ansible.builtin.file:
    path: "{{ homelab_dir }}/ops/{{ item }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0755"
  loop: [requests, data]

- name: Reload systemd now, before enabling
  ansible.builtin.meta: flush_handlers

- name: Timers and path watchers enabled and waiting
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ timers_units | select('match', '.*\\.(timer|path)$') }}"
  # --check doesn't write new unit files, so a new timer can't be found yet
  ignore_errors: "{{ ansible_check_mode }}"
