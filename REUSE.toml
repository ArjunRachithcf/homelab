version = 1
SPDX-PackageName = "homelab"
SPDX-PackageSupplier = "Arjun Rachith"
SPDX-PackageDownloadLocation = "https://github.com/ArjunRachithcf/homelab"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Arjun Rachith"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["site/apps/*.svg", "site/apps/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "selfh.st"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "site/apps/n8n.svg"
precedence = "override"
SPDX-FileCopyrightText = "Dashboard Icons contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "site/apps/ssh-keys.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Arjun Rachith"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "site/apps/bindery.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 vavallee (Bindery's logo, github.com/vavallee/bindery)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["site/fonts/inter.woff2", "site/fonts/OFL-inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "memos/sso-admin.patch"
precedence = "override"
SPDX-FileCopyrightText = ["2025 Memos", "2026 Arjun Rachith"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "proton-drive/live-photos.patch"
precedence = "override"
SPDX-FileCopyrightText = ["2025-2026 Proton AG", "2026 Arjun Rachith"]
SPDX-License-Identifier = "MIT"
