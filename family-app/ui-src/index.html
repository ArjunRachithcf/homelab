<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>__BRAND__</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="welcome" id="welcome">
  <div class="card">
    <img class="mark" src="mark.png" alt="">
    <h1>__BRAND__</h1>
    <p>The family's apps in one window.</p>
    <button class="primary" type="button" id="browser-signin">Sign in with your browser</button>
    <p class="wait" id="wait" hidden>Finish signing in in your browser, then come back here.</p>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="plain" type="button" id="here-signin">Sign in here with an authenticator code</button>
    <p class="fine">Passkeys work in your browser, not inside the app.</p>
  </div>
</main>
<nav class="side" id="side" aria-label="Your apps" hidden>
  <div class="head" data-tauri-drag-region>
    <span class="tools lead">
      <button type="button" id="rail" aria-label="Collapse sidebar" title="Collapse sidebar" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </span>
    <span class="brand"><img src="mark.png" alt=""><span>__BRAND__</span></span>
    <span class="tools">
      <button type="button" data-nav="back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" data-nav="forward" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button type="button" data-nav="reload" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </span>
  </div>
  <div class="homerow">
    <button class="app" id="home" type="button"><span class="icon home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span><span class="n">Home</span></button>
  </div>
  <div class="groups" id="groups"></div>
  <div class="foot" id="foot" hidden>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Checking…</span></div>
    <div class="user">
      <span class="avatar" id="avatar"></span>
      <span class="who"><b id="name"></b></span>
    </div>
    <div class="actions">
      <button type="button" id="browser">Open in browser</button>
      <button type="button" id="signout">Sign out</button>
    </div>
  </div>
</nav>
<script src="app.js"></script>
</body>
</html>
