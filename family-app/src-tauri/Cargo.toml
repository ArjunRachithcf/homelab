[package]
name = "homelab-family"
version = "0.1.0"
description = "The family's apps in one window (name and home page from .env, build.rs)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# unstable: two webviews in one window (the sidebar and the app)
tauri = { version = "2.12", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
# Browser sign-in: PKCE (RFC 7636) and random state
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Linux (Wayland): Tauri's set_position/set_size on child webviews only size_allocate, which GTK
# undoes on its next layout pass, so the app moves them in their GtkFixed itself (same versions as Tauri's)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
