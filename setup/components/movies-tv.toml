title = "Movies and TV on request (Radarr, Sonarr)"
description = "Ask for a film or a series and it arrives in Movies or TV Shows (through Downloads); nothing downloads unless someone asks. Admins, mesh only."
category = "media"
core = false
# Opt-in like downloads, which it needs
opt_in = true
requires = ["downloads"]
suggests = []
conflicts = []
gpu = "none"
platforms = ["fedora", "debian", "ubuntu", "arch"]
services = ["radarr", "sonarr", "recyclarr"]
public_names = []
peer_names = ["radarr", "sonarr"]
blueprints = ["movies-tv.yaml"]
jobs = []
ansible = ""
stages = ["downloads:library", "downloads:quality", "downloads:try"]


[[tiles]]
order = 215
id = "radarr"
name = "Movies"
desc = "Radarr: films on request"
url = "https://radarr.%s/"
icon = "/apps/radarr.svg"
status = "radarr"
group = "admin"
netbird = true
audience = "admin"

[[tiles]]
order = 220
id = "sonarr"
name = "TV"
desc = "Sonarr: series on request"
url = "https://sonarr.%s/"
icon = "/apps/sonarr.svg"
status = "sonarr"
group = "admin"
netbird = true
audience = "admin"

[options.RADARR_TAG]
help = "Radarr version (LinuxServer's image)"
type = "tag"
default = "6.4.4.10685-ls325"
advanced = true
[options.SONARR_TAG]
help = "Sonarr version (LinuxServer's image)"
type = "tag"
default = "4.0.20.3014-ls3"
advanced = true
[options.MOVIE_SIZE_MB_PER_MIN]
help = "Films' sizes as MIN/PREFERRED/MAX in MB per minute of runtime, for the 720p and 1080p qualities (10/40/70: a 2-hour film 1.2/4.8/8.4 GB); empty: TRaSH Guides' sizes"
type = "sizes"
default = ""
advanced = true
[options.EPISODE_SIZE_MB_PER_MIN]
help = "Episodes' sizes the same way (7/20/35: a 45-minute episode 0.3/0.9/1.6 GB); empty: TRaSH Guides' sizes"
type = "sizes"
default = ""
advanced = true
[options.DOWNLOADS_PREFER_X265]
help = "Prefer x265 (HEVC) at 1080p: smaller files, but often re-encodes, which TRaSH Guides' profiles refuse otherwise"
type = "bool"
default = "false"
advanced = true
[options.RECYCLARR_TAG]
help = "Recyclarr version"
type = "tag"
default = "8.8.1"
advanced = true
[options.RADARR_API_KEY]
help = "Radarr's API key"
type = "secret"
required = true
generate = "openssl rand -hex 16"
[options.SONARR_API_KEY]
help = "Sonarr's API key"
type = "secret"
required = true
generate = "openssl rand -hex 16"
[options.RADARR_PASSWORD]
help = "The password of Radarr's own login (break-glass: Authentik's sign-in is the way in)"
type = "secret"
required = true
generate = "openssl rand -base64 36 | tr -d '\\n/+='"
[options.SONARR_PASSWORD]
help = "The password of Sonarr's own login (break-glass: Authentik's sign-in is the way in)"
type = "secret"
required = true
generate = "openssl rand -base64 36 | tr -d '\\n/+='"

[authentik]
outpost = ["Provider for Radarr", "Provider for Sonarr"]
