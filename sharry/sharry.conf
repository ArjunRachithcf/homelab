# ~/homelab/sharry/sharry.conf: Sharry at share.<domain> (RUNBOOK.md 7e). Mounted read-only into
# the container; URLs and secrets come from its environment (docker-compose.yml), ${?VAR} below.
# Everything not set here is Sharry's default (modules/restserver/src/main/resources/reference.conf).
sharry.restserver {
  # The public URL, port included; OAuth's redirect is built from it
  base-url = ${?SHARRY_URL}
  bind {
    address = "0.0.0.0"
    port = 9090
  }

  webapp {
    app-name = "Share"
    # Must be one of the dropdown's values and ≤ max-validity
    default-validity = 7 days
    oauth-auto-redirect = true
  }

  backend {
    auth {
      server-secret = ${?SHARRY_SERVER_SECRET}
      # Only the BRAND account (Authentik). internal and proxy stay set here, not by env: the env reader
      # maps a proxy setting onto the internal prefix (a header-trusting login could switch on).
      fixed.enabled = false
      internal.enabled = false
      proxy.enabled = false
      oauth {
        # The key is the id: redirect https://share.<domain>:9443/api/v2/open/auth/oauth/authentik/resume
        "authentik" {
          enabled = true
          name = "Home account"
          name = ${?BRAND_ACCOUNT}
          icon = "fas fa-user"
          scope = "openid email profile"
          authorize-url = ${?SHARRY_AUTH}"/application/o/authorize/"
          token-url = ${?SHARRY_AUTH}"/application/o/token/"
          user-url = ${?SHARRY_AUTH}"/application/o/userinfo/"
          user-id-key = "preferred_username"
          user-email-key = "email"
          client-id = "sharry"
          client-secret = ${?SHARRY_OIDC_CLIENT_SECRET}
        }
      }
    }

    jdbc {
      url = "jdbc:postgresql://sharry-db:5432/sharry"
      user = "sharry"
      password = ${?SHARRY_DB_PASSWORD}
    }

    # Uploads on disk (volume sharry-files), not in Postgres: the hourly dump stays small. The files
    # aren't backed up: a share lives ≤ 30 days and the sender keeps the original.
    files {
      default-store = "filesystem"
      stores.filesystem {
        enabled = true
        type = "file-system"
        directory = "/data/files"
      }
    }

    signup.mode = "closed"

    share {
      max-size = "5G"
      # Hard limit when a share is created. Changing it afterwards isn't checked by Sharry, so
      # Caddy refuses that route (Caddyfile `(sharry)`).
      max-validity = 30 days
      require-share-password = true
    }

    cleanup {
      enabled = true
      interval = 1 day
      invalid-age = 1 day
    }
  }
}
