# The homelab's own checks on every pull request and push to main (plan Phase 4). Nothing here reaches
# a real machine: the distro job installs packages in throwaway containers only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops the run before it; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck 0.10.0 (warnings and errors; the image pinned by digest)
        run: |
          git ls-files '*.sh' homelab lib/setup/bin | grep -v '^tests/unit/fixtures/' \
            | xargs docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt \
                koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb -x -S warning

  golden-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/caddy/build/go.mod
          cache-dependency-path: tests/caddy/build/go.sum
      - name: Caddy for the behaviour matrix (as caddy/Dockerfile builds it)
        working-directory: tests/caddy/build
        run: go build -o "$RUNNER_TEMP/bin/caddy" . && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Ansible (renders vars.yml and the units)
        run: |
          python -m pip install --quiet "ansible-core>=2.21,<2.22"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Playwright (the console and the setup app's window)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: Unit tests (./homelab selftest)
        run: ./homelab selftest
      - name: Golden (compose, Ansible values, units, blueprints, configure, Caddy matrix; every instance)
        run: bash tests/golden.sh
      - name: The firewall role's mesh guard in network namespaces (tests/firewall/guard.sh)
        run: |
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; }
          sudo bash tests/firewall/guard.sh
      - name: Ansible syntax
        run: ANSIBLE_CONFIG=ansible.cfg ansible-playbook --syntax-check -i localhost, ansible/site.yml tests/distro/install.yml

  # The family desktop app (family-app/): its generated files from the example instance, then its checks
  family-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: family-app/src-tauri
      - name: Its generated files (./homelab configure, tests/fixtures/full.env as .env)
        run: cp tests/fixtures/full.env .env && ./homelab configure
      - name: Clippy
        working-directory: family-app/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Rust tests
        working-directory: family-app/src-tauri
        run: cargo test --locked

  # Each distro family's repos and packages, really installed (tests/distro/install.yml)
  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44", "debian:trixie", "ubuntu:24.04", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Ansible in the container
        run: |
          if command -v dnf >/dev/null; then
            dnf -y -q install ansible-core ansible-collection-community-general ansible-collection-ansible-posix python3-libdnf5 git
          elif command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ansible python3-apt git ca-certificates
          else
            pacman -Syu --noconfirm --needed ansible python git
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repos and packages of every role
        env:
          HOMELAB_DISTRO_TEST: "1"
          ANSIBLE_CONFIG: ansible.cfg
        run: ansible-playbook -i localhost, tests/distro/install.yml --skip-tags service
      - name: On failure, what the package manager itself says
        if: failure()
        run: |
          if command -v dnf >/dev/null; then dnf -y install netbird plexmediaserver nvidia-container-toolkit 2>&1 | tail -n 40
          elif command -v apt-get >/dev/null; then apt-get update 2>&1 | tail -n 20; apt-get install -y netbird plexmediaserver docker-ce 2>&1 | tail -n 40
          fi || true

  # macOS (plan Phase 5, best effort): the launchd jobs, the engine's macOS plan, the playbook's syntax
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A Mac needs Homebrew's bash (the runner image has only /bin/bash 3.2), like every install
      - name: Homebrew bash 4.4+
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: Tests that differ on a Mac (plists through plutil -lint, askpass's peer check through LOCAL_PEERPID)
        run: python -m unittest -v tests.unit.test_launchd tests.unit.test_jobs tests.unit.test_engine tests.unit.test_components tests.unit.test_render tests.unit.test_need_bash tests.unit.test_setup_run.AskpassPeer
      - name: ./homelab on macOS (launchd backend)
        run: ./homelab list && ./homelab status
      - name: Started from macOS's own bash 3.2 (lib/need-bash.sh switches to Homebrew's, or stops)
        run: |
          /bin/bash --version | head -n1
          /bin/bash ./homelab list
          # Without a Homebrew bash it must stop with the hint, not fail somewhere later
          sed 's#/opt/homebrew/bin/bash /usr/local/bin/bash#/nonexistent/bash#' lib/need-bash.sh > "$RUNNER_TEMP/nb.sh"
          if /bin/bash -c "set -u; source '$RUNNER_TEMP/nb.sh'; echo still running" 2>"$RUNNER_TEMP/err"; then exit 1; fi
          grep -q 'brew install bash' "$RUNNER_TEMP/err"
      - name: Ansible syntax (site-macos.yml)
        run: |
          python -m pip install --quiet "ansible-core>=2.21,<2.22"
          ansible-galaxy collection install -r ansible/requirements.yml
          ANSIBLE_CONFIG=ansible.cfg ansible-playbook --syntax-check -i localhost, ansible/site-macos.yml
