version: 1
metadata:
  name: homelab - book-requests
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: bindery-provider
    identifiers:
      name: Provider for Book requests
    attrs:
      mode: forward_single
      external_host: https://bindery.example.com:9443
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  - model: authentik_core.application
    id: bindery-app
    identifiers:
      slug: book-requests
    attrs:
      name: Book requests
      provider: !KeyOf bindery-provider
      meta_launch_url: https://bindery.example.com:9443/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bindery-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bindery-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
  - model: authentik_providers_oauth2.oauth2provider
    id: bindery-oidc-provider
    identifiers:
      name: Provider for Book requests sign-in
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, email (verified)]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      client_id: bindery
      client_secret: !Env BINDERY_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://bindery.example.com:9443/api/v1/auth/oidc/authentik/callback
  - model: authentik_core.application
    id: bindery-oidc-app
    identifiers:
      slug: bindery
    attrs:
      name: Book requests (sign-in)
      provider: !KeyOf bindery-oidc-provider
      meta_launch_url: blank://blank
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bindery-oidc-app
      group: !Find [authentik_core.group, [name, family]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bindery-oidc-app
      group: !Find [authentik_core.group, [name, kids]]
      order: 1
    attrs:
      negate: true
